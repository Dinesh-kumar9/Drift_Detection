[flake8]
max-line-length = 120
exclude =
    alembic/,
    .venv/,
    __pycache__/,
    .git/
# Ignore:
# E501 line too long (handled by max-line-length)
# W503 line break before binary operator (conflicts with black)
# E203 whitespace before ':' (conflicts with black)
per-file-ignores =
    app/workers/training_tasks.py:E501
ignore = W503,E203

[isort]
profile = black
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
line_length = 120
skip_glob = alembic/*

[tool:pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
